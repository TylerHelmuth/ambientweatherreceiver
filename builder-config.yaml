# Example OpenTelemetry Collector Builder (ocb) manifest.
#
# Produces a custom Collector binary that includes the Ambient Weather receiver
# from this repository. Build it with `make build`.
#
# Docs: https://opentelemetry.io/docs/collector/custom-collector/
#       https://opentelemetry.io/docs/collector/extend/custom-component/receiver/

dist:
  name: otelcol-ambientweather
  description: Example OpenTelemetry Collector build with the Ambient Weather receiver
  output_path: ./_build
  version: 0.1.0
  # Core collector version the components below are built against. Keep this in
  # sync with the go.opentelemetry.io/collector/* versions in the receiver's go.mod.
  otelcol_version: 0.164.0

receivers:
  - gomod: github.com/TylerHelmuth/ambientweatherreceiver/ambientweatherreceiver v0.1.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.164.1

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.164.1

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.164.1

# This repository IS the receiver module, so build against the local copy rather
# than a published release. Drop this replace once you consume a tagged version
# (e.g. github.com/TylerHelmuth/ambientweatherreceiver/ambientweatherreceiver v0.1.0) from a Go proxy.
# The path is relative to the generated go.mod in `output_path` (./_build), so it
# walks up one level to reach the receiver directory at the repo root.
replaces:
  - github.com/TylerHelmuth/ambientweatherreceiver/ambientweatherreceiver => ../ambientweatherreceiver
